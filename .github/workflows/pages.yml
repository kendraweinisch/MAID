name: Deploy to GitHub Pages

# Builds and publishes the site every time main changes (and on demand).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Served at https://eolatlas.org (custom domain set in Settings > Pages).
      BASE_PATH: ${{ vars.BASE_PATH || '/' }}
      SITE_PUBLIC_URL: ${{ vars.SITE_PUBLIC_URL || 'https://eolatlas.org' }}
      # Set the repository variable SITE_INDEXABLE to "true" at launch.
      SITE_INDEXABLE: ${{ vars.SITE_INDEXABLE || 'false' }}
      # GoatCounter analytics code (the part before .goatcounter.com).
      GOATCOUNTER_CODE: ${{ vars.GOATCOUNTER_CODE || 'eolatlas' }}
      # Web3Forms access key for the suggestions form (public by design, not a secret).
      FORMS_ACCESS_KEY: ${{ vars.FORMS_ACCESS_KEY || '67c55111-e8a0-4ff4-b07e-d3ed82eb1532' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node build.mjs
      - run: node scripts/check.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
